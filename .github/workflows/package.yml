name: Package AutoDock

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 1.0.0'
        required: true
        default: '1.0.0'
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and package
        env:
          APP_VERSION: ${{ inputs.version }}
          AUTODOCK_BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/package.sh "$APP_VERSION"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: AutoDock-${{ inputs.version }}-universal
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
